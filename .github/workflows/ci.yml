name: ci

# Pins the SuperSLM engine, configures, builds and runs the test suite on
# Windows (MSVC), Linux (GCC) and macOS (AppleClang). Cells that need the real
# model are labelled real_artifact and are excluded below; each reports its
# real-model leg as a missing prerequisite rather than a failure when the
# model is absent.
#
# Hosted runs are manual: hosted minutes are spent on release-shaped tips only.
# No leg overrides the toolchain: configure refuses no compiler, and a
# toolchain outside docs/certified-builds.json builds and runs in the
# uncertified epoch.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: tests/epoch_store_check.py diffs epoch-store/ against
      # the parent commit, which a depth-1 clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The engine's tokenizer converter requires Unicode 15.1.0 in
          # unicodedata, which CPython ships from 3.13.
          python-version: "3.13"

      - name: Install fixture-generation dependencies
        shell: bash
        # The synthetic-fixture regenerators (tests/fixtures/regenerate_*.py)
        # dynamically import the pinned engine's tools/reference_pipeline
        # (pipeline.py, convert_model.py, sslm_convert_manifest.py,
        # sslm_convert_validate.py, sslm_model_writer.py) and
        # tools/convert_tokenizer.py from a hermetic clone at ctest time.
        # numpy is the ONLY third-party import anywhere in that chain
        # (verified against the pinned tag's own tools/reference_pipeline/
        # and tools/*.py); every ctest-invoked script under tests/ is
        # otherwise stdlib-only.
        run: python -m pip install --upgrade pip numpy

      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Pin the SuperSLM engine
        shell: bash
        run: |
          python tools/pin-superslm/pin_superslm.py \
            --lock superslm.lock \
            --prefix build/_engine_install \
            --cmake cmake \
            --ninja ninja \
            --generator Ninja

      - name: Configure SuperEmbedder
        shell: bash
        # Release: the optimisation level does not change the emitted
        # vector (docs/DETERMINISM.md), and an empty build type is both an
        # untested configuration and several times slower on this suite.
        # No toolchain override: the certified set is decided at encoder open
        # from the build's compiled-in descriptor, never at configure. The
        # resolved identity each leg configured against is printed next.
        run: |
          cmake -G Ninja -S . -B build/semb \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(pwd)/build/_engine_install"

      - name: Report the resolved compiler identity
        shell: bash
        # Prints CMAKE_CXX_COMPILER_ID/_VERSION into the job log from
        # CMake's own per-configure generated file (these are ordinary
        # variables, not cache entries, so they do not appear in
        # CMakeCache.txt), so whether a hosted leg's toolchain matches a
        # certified cell is read from a real run rather than guessed.
        run: |
          compiler_info_file=$(find build/semb/CMakeFiles -maxdepth 2 -name CMakeCXXCompiler.cmake | head -n1)
          grep -E "CMAKE_CXX_COMPILER_ID |CMAKE_CXX_COMPILER_VERSION |CMAKE_CXX_COMPILER_FRONTEND_VARIANT " "$compiler_info_file"

      - name: Build
        shell: bash
        run: cmake --build build/semb

      - name: Build the workspace-seam test targets (EXCLUDE_FROM_ALL)
        shell: bash
        # u1_workspace_seam_test and its superembedder_testseam dependency
        # (tests/CMakeLists.txt's semb_add_workspace_tests()) are declared
        # EXCLUDE_FROM_ALL so the default build stays lean; the default
        # `cmake --build build/semb` above never produces them, so
        # u1_workspace_seam_absent_check has nothing to read without
        # this explicit target build.
        run: cmake --build build/semb --target u1_workspace_seam_test

      - name: Run the smoke CLI
        shell: bash
        run: |
          if [ -f build/semb/semb.exe ]; then
            build/semb/semb.exe
          else
            build/semb/semb
          fi

      - name: Run the mechanism-cell suite (excludes real-artifact legs and multi-GB mints)
        shell: bash
        # -LE excludes two labels from tests/CMakeLists.txt. real_artifact is applied
        # only when the real model is configured (-DSEMB_C12B_MODEL / -DSEMB_U1_TOKENIZER);
        # CI configures neither, so it guards a build tree later pointed at the model.
        # multi_gb_mint marks the cells whose fixture mints need several GB of heap,
        # more than a hosted runner holds; they run on the dev box.
        run: ctest --test-dir build/semb --output-on-failure -LE "real_artifact|multi_gb_mint"
